services:
  ollama:
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=60m
    volumes:
      - ./ollama:/root/.ollama
      - ./Architect.modelfile:/etc/ollama/Architect.modelfile
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: '16gb'          

  open-webui:
    extends:
      file: docker-compose.yaml
      service: ollama
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - ./open-webui:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY=sua_chave_secreta_aqui'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

services:
  ollama:
    image: ollama/ollama:latest
    container_name: donatello-ollama
    pull_policy: always
    ports:
      # A API fica acessível somente nesta máquina. O Open WebUI usa a rede interna.
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      # Um modelo por vez evita que pesos e KV cache disputem os 8 GB de VRAM.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 30m
      # Reduz a pressão de VRAM do KV cache para o contexto de desenvolvimento.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ./ollama:/root/.ollama
      - ./Architect.modelfile:/models/Architect.modelfile:ro
      - ./Fast.modelfile:/models/Fast.modelfile:ro
      - ./OpenCode.modelfile:/models/OpenCode.modelfile:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Execute uma vez com: docker compose --profile bootstrap run --rm ollama-init
  ollama-init:
    image: ollama/ollama:latest
    profiles: [bootstrap]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    volumes:
      - ./Architect.modelfile:/models/Architect.modelfile:ro
      - ./Fast.modelfile:/models/Fast.modelfile:ro
      - ./OpenCode.modelfile:/models/OpenCode.modelfile:ro
    entrypoint: ["/bin/sh", "-lc"]
    command: >-
      ollama create francis-bacon-architect -f /models/Architect.modelfile &&
      ollama create francis-bacon-fast -f /models/Fast.modelfile &&
      ollama create francis-bacon-opencode -f /models/OpenCode.modelfile

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: donatello-open-webui
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-this-local-secret}
    volumes:
      - ./open-webui:/app/backend/data
    restart: unless-stopped
